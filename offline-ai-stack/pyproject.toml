[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-ai-stack"
version = "0.1.0"
description = "Fully-offline replacement for Claude Code + Claude MEM + multi-agent dev team."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["skills", "crews"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
