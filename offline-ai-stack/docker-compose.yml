# Single-file consolidation of every dockerized service in the stack.
# vLLM is NOT here — it runs natively under systemd (see configs/vllm-*.service).
#
# Usage:
#   export FORGEJO_OAUTH_CLIENT=...     # from Forgejo Settings > Applications
#   export FORGEJO_OAUTH_SECRET=...
#   export WOODPECKER_AGENT_SECRET=$(openssl rand -hex 32)
#   docker compose up -d
#
# Hostnames inside the compose network resolve by service name, so
# Woodpecker reaches Forgejo at http://forgejo:3000 (no host-gateway hack).

services:
  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - ${HOME}/offline-ai-stack/memory:/chroma/chroma

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPENAI_API_BASE_URL: http://host.docker.internal:8000/v1
      OPENAI_API_KEY: local
      ENABLE_RAG_LOCAL_WEB_FETCH: "true"
    volumes:
      - open-webui:/app/backend/data

  searxng:
    image: searxng/searxng
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - searxng:/etc/searxng

  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    container_name: forgejo
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
      - "127.0.0.1:222:22"
    volumes:
      - ${HOME}/offline-ai-stack/forgejo:/data

  woodpecker-server:
    image: woodpeckerci/woodpecker-server:latest
    container_name: woodpecker-server
    restart: unless-stopped
    depends_on: [forgejo]
    ports:
      - "127.0.0.1:8003:8000"
      - "127.0.0.1:9000:9000"
    environment:
      WOODPECKER_OPEN: "true"
      WOODPECKER_HOST: http://localhost:8003
      WOODPECKER_GITEA: "true"
      WOODPECKER_GITEA_URL: http://forgejo:3000
      WOODPECKER_GITEA_CLIENT: ${FORGEJO_OAUTH_CLIENT}
      WOODPECKER_GITEA_SECRET: ${FORGEJO_OAUTH_SECRET}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
    volumes:
      - woodpecker-server-data:/var/lib/woodpecker

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:latest
    container_name: woodpecker-agent
    restart: unless-stopped
    depends_on: [woodpecker-server]
    environment:
      WOODPECKER_SERVER: woodpecker-server:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:latest
    container_name: dcgm-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9400:9400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped
    depends_on: [dcgm-exporter]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./configs/prom.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    depends_on: [prometheus]
    ports:
      - "127.0.0.1:3003:3000"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  open-webui:
  searxng:
  woodpecker-server-data:
  prometheus-data:
  grafana-data:
